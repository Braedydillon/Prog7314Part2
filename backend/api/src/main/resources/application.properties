spring.config.import=optional:file:.env[.properties]

spring.application.name=api
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

server.error.include-message=always
server.error.include-binding-errors=always

# Rewards (login streak and points)
rewards.points-per-rand=10
rewards.daily-points=10
# Milestone bonuses
rewards.milestone-cycle-days=30
rewards.milestones.3=25
rewards.milestones.7=75
rewards.milestones.14=150
rewards.milestones.30=400
# Days before streak shield resets
rewards.shield-cooldown-days=7

azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.container=product-images

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
